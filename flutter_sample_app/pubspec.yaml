name: flutter_video_editor_sample
description: Minimal Flutter video editor (trim, speed, effects, captions, FFmpeg export).
publish_to: "none"

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.6.0
  ffmpeg_kit_flutter_full_gpl: ^5.1.0
  file_picker: ^5.2.2
  path_provider: ^2.0.14
  permission_handler: ^10.4.0
  speech_to_text: ^5.8.0
  intl: ^0.18.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
